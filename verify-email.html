<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación de email | CocheCierto</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:light;font-family:Arial,sans-serif;background:#f3f7f6;color:#082333}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:560px;background:#fff;border:1px solid #d7e2df;border-radius:20px;padding:36px;box-shadow:0 12px 35px #08233318;text-align:center}
    .brand{font-size:24px;font-weight:700;margin-bottom:34px}.brand span{color:#ff4d00}
    .eyebrow{color:#ff4d00;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
    h1{font-size:32px;line-height:1.15;margin:12px 0 16px}p{font-size:16px;line-height:1.6;color:#58717d}
    .button{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:999px;background:#ff4d00;color:#fff;text-decoration:none;font-weight:700}
    .error{color:#a83218}.loading{color:#58717d}
  </style>
</head>
<body>
  <main>
    <div class="brand">Coche<span>Cierto</span></div>
    <div class="eyebrow">Solicitud recibida</div>
    <h1 id="title">Confirmando tu email…</h1>
    <p id="message" class="loading">Estamos validando tu dirección para preparar el informe.</p>
    <a id="download" class="button" href="#" hidden>Descargar mi informe</a>
    <a class="button" href="/valorador/">Volver al valorador</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const title = document.querySelector('#title');
      const message = document.querySelector('#message');
      const token = params.get('token');
      const download = document.querySelector('#download');
      if (!token) { title.textContent='Enlace incompleto'; message.textContent='Solicita un nuevo informe para recibir otro enlace de validación.'; message.className='error'; return; }
      fetch(`https://api.cochecierto.com/api/verify-email?token=${encodeURIComponent(token)}`)
        .then(response => response.json().then(data => ({ok:response.ok,data})))
        .then(result => { if (!result.ok) throw new Error(result.data.error); title.textContent='Email confirmado'; message.textContent='Tu dirección está validada. Puedes descargar tu informe durante los próximos 7 días.'; message.className=''; download.href=`https://api.cochecierto.com${result.data.downloadUrl}`; download.hidden=false; })
        .catch(error => { title.textContent='No hemos podido confirmar el email'; message.textContent=error.message || 'El enlace no es válido o ha caducado. Solicita otro informe.'; message.className='error'; });
    })();
  </script>
</body>
</html>
